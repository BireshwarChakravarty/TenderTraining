name: Publish site
# Keeps the gh-pages branch in step with main. GitHub Pages serves that branch at
# https://bireshwarchakravarty.github.io/TenderTraining/
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the site folder
        run: |
          mkdir -p _site
          cp -r index.html present practice assets _site/
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Ask GitHub Pages to rebuild
        # Pushes made with GITHUB_TOKEN don't start a Pages build on their own.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          curl -sS "${auth[@]}" "$api" | grep -E '"(build_type|branch|path|status|html_url)"' || true
          curl -sS -f -X POST "${auth[@]}" "$api/builds"
